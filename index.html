/* ================= Lewis structure renderer ================= */
const LANG={1:[0],2:[180,0],3:[180,0,90],4:[180,0,90,270],5:[90,162,234,306,18],6:[90,150,210,270,330,30]};
const angDist=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
function freeAngles(used,n){
  const cand=[90,270,0,180,45,135,225,315], out=[], all=used.slice();
  for(let k=0;k<n;k++){
    let best=null,bd=-1;
    for(const c of cand){if(out.includes(c))continue;const md=all.length?Math.min(...all.map(u=>angDist(u,c))):999;if(md>bd+0.01){bd=md;best=c}}
    out.push(best);all.push(best);
  }
  return out;
}
function lewisSVG(m,{lp=true,singles=false}={}){
  const cx=140,cy=120,L=m.X>4?68:64,R=Math.PI/180,ang=LANG[m.X];
  const P=(x,y,a,r)=>[x+r*Math.cos(a*R),y-r*Math.sin(a*R)];
  const dr=s=>s.length>1?17:13.5;
  const f=n=>n.toFixed(1);
  const pair=(x,y,a,r,cls)=>{const [px,py]=P(x,y,a,r),nx=Math.sin(a*R)*3.8,ny=Math.cos(a*R)*3.8;return `<circle class="${cls}" cx="${f(px+nx)}" cy="${f(py+ny)}" r="2.7"/><circle class="${cls}" cx="${f(px-nx)}" cy="${f(py-ny)}" r="2.7"/>`};
  let s='';
  m.outers.forEach((o,i)=>{
    const a=ang[i],bo=singles?1:o.bo;
    const [x1,y1]=P(cx,cy,a,dr(m.center)+2),[x2,y2]=P(cx,cy,a,L-dr(o.el)-2);
    const offs=bo===1?[0]:bo===2?[-3.6,3.6]:[-5.4,0,5.4], nx=Math.sin(a*R), ny=Math.cos(a*R);
    offs.forEach(d=>{s+=`<line class="lw-bond" x1="${f(x1+nx*d)}" y1="${f(y1+ny*d)}" x2="${f(x2+nx*d)}" y2="${f(y2+ny*d)}"/>`});
  });
  if(lp){
    m.outers.forEach((o,i)=>{
      const a=ang[i],[x,y]=P(cx,cy,a,L);
      const dirs=o.lp===3?[a,a+90,a-90]:o.lp===2?[a+62,a-62]:o.lp===1?[a]:[];
      dirs.forEach(d=>{s+=pair(x,y,d,dr(o.el)+2,'dot')});
    });
    freeAngles(ang,m.cLP).forEach(a=>{s+=pair(cx,cy,a,dr(m.center)+3,'cdot')});
  }
  s+=`<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="22">${m.center}</text>`;
  m.outers.forEach((o,i)=>{const [x,y]=P(cx,cy,ang[i],L);s+=`<text x="${f(x)}" y="${f(y)}" text-anchor="middle" dominant-baseline="central" font-size="20">${o.el}</text>`});
  const pts=[[cx,cy],...m.outers.map((o,i)=>P(cx,cy,ang[i],L))];
  let x0=Math.min(...pts.map(p=>p[0]))-27,x1=Math.max(...pts.map(p=>p[0]))+27,y0=Math.min(...pts.map(p=>p[1]))-27,y1=Math.max(...pts.map(p=>p[1]))+27;
  if(m.charge){
    s+=`<path class="br" d="M${f(x0+9)} ${f(y0)}H${f(x0)}V${f(y1)}H${f(x0+9)}"/><path class="br" d="M${f(x1-9)} ${f(y0)}H${f(x1)}V${f(y1)}H${f(x1-9)}"/><text x="${f(x1+4)}" y="${f(y0+10)}" font-size="17">${chargeStr(m.charge)}</text>`;
    x1+=22;
  }
  x0-=6;y0-=6;x1+=6;y1+=6;
  const vw=x1-x0,vh=y1-y0;
  return `<svg class="lewis" viewBox="${f(x0)} ${f(y0)} ${f(vw)} ${f(vh)}" style="max-width:${Math.round(vw*1.25)}px" role="img" aria-label="Lewis structure of ${m.id}">${s}</svg>`;
}

/* ================= 3D molecule viewer ================= */
function hexLum(h){const m=h.replace('#','');if(m.length<6)return .5;const r=parseInt(m.slice(0,2),16)/255,g=parseInt(m.slice(2,4),16)/255,b=parseInt(m.slice(4,6),16)/255;return .2126*r+.7152*g+.0722*b}
function mount3D(cv,spec){
  const ctx=cv.getContext('2d');
  let W=0,H=0,yaw=.75,pitch=-.32,drag=null,lastTouch=-9999,showLP=true,items=[],center='A',visible=true;
  const colors={};
  function readColors(){const cs=getComputedStyle(document.documentElement);['--accent','--u1','--lp','--bond','--ink'].forEach(v=>colors[v]=cs.getPropertyValue(v).trim()||'#888')}
  function setSpec(s){
    spec=s;const sh=SHAPES[s.axe];let k=0;
    items=GEOM[sh.g].map((p,i)=>sh.lp.includes(i)?{lp:true,p}:{lp:false,p,el:(s.outers&&s.outers[k++])||'X'});
    center=s.center||'A';
  }
  function resize(){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.max(1,Math.round(W*d));cv.height=Math.max(1,Math.round(H*d));ctx.setTransform(d,0,0,d,0,0)}
  function rot([x,y,z]){const cy=Math.cos(yaw),sy=Math.sin(yaw),x1=x*cy+z*sy,z1=-x*sy+z*cy,cp=Math.cos(pitch),sp=Math.sin(pitch);return [x1,y*cp-z1*sp,y*sp+z1*cp]}
  function proj(p,L){const f=1/(1-p[2]*.17);return [W/2+p[0]*L*f,H/2-p[1]*L*f,f]}
  const atomColor=el=>el==='A'?colors['--accent']:el==='X'?colors['--u1']:(CPK[el]||colors['--accent']);
  function draw(){
    ctx.clearRect(0,0,W,H);
    const L=Math.min(W,H)*.36, list=[];
    items.forEach(it=>{const r=rot(it.p);if(it.lp){if(showLP)list.push({k:'lp',r,z:r[2]*.62})}else{list.push({k:'bond',r,z:r[2]*.5-.001});list.push({k:'atom',r,z:r[2],el:it.el})}});
    list.push({k:'atom',r:[0,0,0],z:0,el:center,c:true});
    list.sort((a,b)=>a.z-b.z);
    const O=proj([0,0,0],L);
    for(const d of list){
      if(d.k==='bond'){
        const P=proj(d.r,L);
        ctx.lineCap='round';ctx.strokeStyle=colors['--bond'];ctx.lineWidth=L*.11*(O[2]+P[2])/2;
        ctx.beginPath();ctx.moveTo(O[0],O[1]);ctx.lineTo(P[0],P[1]);ctx.stroke();
      }else if(d.k==='lp'){
        const P=proj([d.r[0]*.6,d.r[1]*.6,d.r[2]*.6],L);
        const a=Math.atan2(P[1]-O[1],P[0]-O[0]), flat=Math.hypot(d.r[0],d.r[1]);
        const rx=L*.32*P[2]*(.4+.6*flat), ry=L*.17*P[2];
        ctx.save();ctx.translate(P[0],P[1]);ctx.rotate(a);
        ctx.globalAlpha=.28;ctx.fillStyle=colors['--lp'];ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=.85;ctx.strokeStyle=colors['--lp'];ctx.lineWidth=1.5;ctx.stroke();
        ctx.globalAlpha=1;ctx.fillStyle=colors['--lp'];
        ctx.beginPath();ctx.arc(rx*.15,-ry*.38,2.4,0,Math.PI*2);ctx.arc(rx*.15,ry*.38,2.4,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }else{
        const P=d.c?O:proj(d.r,L), col=atomColor(d.el);
        const rr=(d.c?.27:d.el==='H'?.16:.21)*L*P[2];

        const g=ctx.createRadialGradient(P[0]-rr*.38,P[1]-rr*.42,rr*.05,P[0],P[1],rr);
        g.addColorStop(0,'rgba(255,255,255,.7)');g.addColorStop(.45,'rgba(255,255,255,.08)');g.addColorStop(1,'rgba(0,0,0,.22)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(P[0],P[1],rr,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=hexLum(col)>.6?'#151726':'#ffffff';
        ctx.font=`700 ${Math.round(rr*(d.el.length>1?.78:.95))}px 'Atkinson Hyperlegible',system-ui,sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.el,P[0],P[1]+1);
      }
    }
  }
  function loop(t){
    if(!cv.isConnected){ro.disconnect();io.disconnect();mo.disconnect();return}
    if(visible){if(!drag&&!REDUCE&&t-lastTouch>1800)yaw+=.006;draw()}
    requestAnimationFrame(loop);
  }
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
  cv.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag.yaw+(e.clientX-drag.x)*.012;pitch=Math.max(-1.4,Math.min(1.4,drag.pitch+(e.clientY-drag.y)*.012))});
  const end=()=>{drag=null;lastTouch=performance.now();cv.style.cursor=''};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  const ro=new ResizeObserver(resize);ro.observe(cv);
  const io=new IntersectionObserver(es=>{visible=es[0].isIntersecting});io.observe(cv);
  const mo=new MutationObserver(readColors);mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
  readColors();setSpec(spec);resize();requestAnimationFrame(loop);
  return {setSpec,setLP:v=>{showLP=v}};
}

      $$('.sortrow',qb).forEach(row=>{const i=+row.dataset.i,it=q.items[i],bs=$$('button',row);bs.forEach(b=>b.setAttribute('aria-pressed','false'));const r=pickd[i]===it[1];if(!r){ok=false;bs[pickd[i]].classList.add('wrong')}bs[it[1]].classList.add('right')});

/* ---- streaming call ---- */
async function tutorStream(messages,extra,onDelta,signal){
  const base=await tutorBase();
  const send=()=>fetch(base+'/chat',{method:'POST',signal,headers:{'Content-Type':'application/json','X-SCODE-Device':tutorDevice()},
    body:JSON.stringify({tier:TUTOR_CONFIG.tier,app:TUTOR_CONFIG.app,extra_context:extra,messages})});
  let res=await send();
  if(res.status===503){onDelta(null,'busy');await new Promise(r=>setTimeout(r,3000));res=await send()}
  // SCODE Rush Hour: people with SCODE AI accounts go first. Wait and try again on our own.
  while(res.status===409){
    let j={};try{j=await res.clone().json()}catch(e){}
    if(j.error!=='rush_hold')break;
    onDelta(null,'rush');
    await new Promise((ok,no)=>{const t=setTimeout(ok,8000);if(signal)signal.addEventListener('abort',()=>{clearTimeout(t);no(new DOMException('Stopped','AbortError'))},{once:true})});
    res=await send();
  }
  if(!res.ok){let j={};try{j=await res.json()}catch(e){}throw Object.assign(new Error(j.message||j.error||'HTTP '+res.status),{status:res.status,data:j})}
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
    const {done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const line of lines){
      if(!line.trim())continue;
      let c;try{c=JSON.parse(line)}catch(e){continue}
      if(c.error)throw new Error(c.message||'The server stopped partway through.');
      if(c.safety){
        const k=c.safety.kind;
        if(k==='warn')throw new Error(`That message goes against SCODE’s rules, so it wasn’t answered. Warning ${c.safety.n} of ${c.safety.of}.`);
        if(k==='flag')throw new Error('That message was flagged for review, so SCODE Tutor is paused on this browser for 24 hours. The rest of the site still works.');
        continue;   // 'support': a caring reply follows as normal text
      }
      if(c.message&&c.message.content)onDelta(c.message.content);
    }
  }
}
function tutorError(e){
  if(e.name==='AbortError')return 'Stopped.';
  if(e.status===429&&e.data&&typeof e.data.reset_at==='number'&&e.data.reset_at*1000-Date.now()<300000)return 'That’s a lot of questions at once. Wait a minute, then ask again.';
  if(e.status===429){const t=e.data&&e.data.reset_at?new Date(typeof e.data.reset_at==='number'&&e.data.reset_at<1e12?e.data.reset_at*1000:e.data.reset_at):null;return `SCODE Tutor has used up its messages for now.${t&&!isNaN(t)?` It resets at ${t.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}.`:' Try again later.'}`}
  if(e.status===503)return 'The SCODE server is busy. Try again in a minute.';
  if(e.status===403&&e.data&&e.data.error==='guest_blocked')return 'SCODE Tutor is paused on this browser for now after a flagged message. The rest of the site still works.';
  if(e.status===403){console.warn('SCODE Tutor 403',e.data);return 'SCODE Tutor isn’t open to this site right now.'}
  if(e.status===400)return 'That message didn’t go through. Try asking a different way.';
  if(e instanceof TypeError){pingTutor();return 'Couldn’t reach the SCODE server. It may have just gone offline.'}
  return e.message||'Something went wrong.';
}

/* ---- tiny markdown ---- */
function mdLite(src){
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const inline=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\^\{?(\d+)\}?/g,(m,d)=>sup(d)).replace(/_\{?(\d+)\}?/g,(m,d)=>sub(d)).replace(/\\rightarrow|->/g,'→');
  const s=esc(src).replace(/\\\(|\\\)|\\\[|\\\]/g,'').replace(/\$([^$\n]+)\$/g,'$1');
  let out='',list=null;
  for(const ln of s.split('\n')){
    const b=ln.match(/^\s*[-*•]\s+(.*)/),n=ln.match(/^\s*\d+[.)]\s+(.*)/);
    if(b||n){const tag=b?'ul':'ol';if(list!==tag){if(list)out+=`</${list}>`;out+=`<${tag}>`;list=tag}out+=`<li>${inline((b||n)[1])}</li>`;continue}
    if(list){out+=`</${list}>`;list=null}
    if(/^#{1,4}\s/.test(ln)){out+=`<p><b>${inline(ln.replace(/^#+\s/,''))}</b></p>`;continue}
    if(ln.trim())out+=`<p>${inline(ln)}</p>`;
  }
  if(list)out+=`</${list}>`;
  return out;
}

function mountThread(host,{mode='chat',context='',ask=null,showAsk=false,closable=true,placeholder='Ask a follow-up'}={}){
  const wrap=document.createElement('div');wrap.className='ai-frame';
  wrap.innerHTML=`<div class="ai-thread"><div class="ai-head">${logoSVG(22)}<b>SCODE Tutor</b><span class="ai-tag">General Plus</span>${closable?'<button class="ai-x" type="button" aria-label="Close the tutor">×</button>':''}</div>

    <div class="err ai-errin" hidden>Type a question first.</div></div>`;
  host.appendChild(wrap);
  const box=$('.ai-msgs',wrap),form=$('.ai-ask',wrap),inp=$('input',form),err=$('.ai-errin',wrap);

  async function send(text,visible=true){
    msgs.push({role:'user',content:text});
    if(visible)box.insertAdjacentHTML('beforeend',`<div class="ai-u">${text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`);
    box.insertAdjacentHTML('beforeend',`<div class="ai-a">${atomLoader()}</div>`);
    const bub=box.lastElementChild,lt=$('.ai-lt',bub),t0=Date.now();
    wrap.classList.add('busy');form.hidden=true;err.hidden=true;
    let rush=false;
    const tick=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);if(lt)lt.textContent=rush?'Rush Hour \u00b7 waiting for a turn':s<4?'Thinking':`Thinking · ${s}s`},500);
    let acc='',raf=0;
    const paint=()=>{raf=0;bub.innerHTML=mdLite(acc)+'<span class="ai-caret"></span>';scroll()};
    ctl=new AbortController();
    bub.insertAdjacentHTML('beforeend','<button class="ai-stop" type="button">Stop</button>');
    $('.ai-stop',bub).addEventListener('click',()=>ctl.abort());
    scroll();
    try{
      await tutorStream(msgs,extra,(d,flag)=>{if(flag==='rush'){if(!rush){rush=true;bub.insertAdjacentHTML('beforeend','<p class="ai-rush">SCODE is in Rush Hour, so people with SCODE AI accounts go first. Your question will send by itself in a moment.</p>')}if(lt)lt.textContent='Rush Hour \u00b7 waiting for a turn';return}if(rush){rush=false;const n=bub.querySelector('.ai-rush');if(n)n.remove()}if(flag==='busy'){if(lt)lt.textContent='Server busy, retrying';return}if(!acc)clearInterval(tick);acc+=d;if(!raf)raf=requestAnimationFrame(paint)},ctl.signal);
      if(raf)cancelAnimationFrame(raf);
      if(!acc.trim())throw new Error('SCODE Tutor didn’t send an answer. Try again.');
      bub.innerHTML=mdLite(acc);msgs.push({role:'assistant',content:acc});
    }catch(e){
      if(raf)cancelAnimationFrame(raf);
      bub.innerHTML=(acc?mdLite(acc):'')+`<p class="ai-errmsg">${tutorError(e)}</p>`;
      if(acc)msgs.push({role:'assistant',content:acc});else msgs.pop();
    }finally{clearInterval(tick);wrap.classList.remove('busy');form.hidden=false;ctl=null}
  }
  form.addEventListener('submit',e=>{e.preventDefault();const v=inp.value.trim();if(!v){err.hidden=false;return}inp.value='';send(v)});
  inp.addEventListener('input',()=>err.hidden=true);
  const x=$('.ai-x',wrap);if(x)x.addEventListener('click',()=>{if(ctl)ctl.abort();wrap.classList.add('out');setTimeout(()=>wrap.remove(),REDUCE?0:260)});
  if(ask)send(ask.text,ask.visible!==false);
  return {send};
}

/* ================= Lewis builder ================= */
function mountBuilder(el,id,{lesson=false,onDone,onNext}={}){
  const m=MOLS[id];
  const steps=[];
  steps.push({k:'ve',type:'num',label:'Total valence electrons',prompt:`Count the total valence electrons in <b>${m.html}</b>.`,hint:`Add each atom’s valence electrons from its group${m.charge?', then adjust for the charge (negative adds, positive subtracts)':''}.`,ans:m.ve,show:veBreakdown(m),topic:'lewis'});
  steps.push({k:'bonds',type:'num',label:'Bonds from the formula',prompt:'How many bonds does the formula give?<br><span class="muted small">(wanted − have) ÷ 2, where wanted is 8 per atom and 2 per H</span>',hint:`Wanted: ${m.atoms.filter(a=>a!=='H').length} atom${m.atoms.filter(a=>a!=='H').length>1?'s':''} × 8${m.counts.H?` + ${m.counts.H} H × 2`:''}.`,ans:m.formula,show:`Wanted ${wantedBreakdown(m)}. (${m.wanted} − ${m.ve}) ÷ 2 = ${m.formula}.`,topic:'lewis'});
  const types=uniq(m.atoms);
  if(types.length>1)steps.push({k:'center',type:'choice',label:'Central atom',prompt:'Which atom goes in the center?',opts:shuffle(types),ans:m.center,show:centerWhy(m),topic:'lewis'});
  steps.push({k:'case',type:'choice',label:'Bond plan',prompt:`The skeleton has <b>${m.X}</b> single bond${m.X>1?'s':''}, and the formula says <b>${m.formula}</b>. What does that mean?`,opts:shuffle(Object.values(CASES)),ans:CASES[m.kase],show:caseNote(m),topic:'lewis',pic:m.kase==='multiple'?1:2});
  if(m.kase==='multiple'){
    const ot=uniq(m.outers.map(o=>o.el));
    if(ot.length>=2){
      const gets=uniq(m.outers.filter(o=>o.bo>1).map(o=>o.el));
      const both=ot.length===2?`Both ${ot[0]} and ${ot[1]}`:null;
      const opts=[...ot];if(both)opts.push(both);
      steps.push({k:'where',type:'choice',label:'Extra bonds go to',prompt:`Which outer atom${m.formula-m.X>1?'s get':' gets'} the extra bond${m.formula-m.X>1?'s':''}?`,opts,ans:gets.length===2&&both?both:gets[0],show:`Never H or a halogen. ${m.outers.filter(o=>o.bo>1).map(o=>o.bo===3?`${m.center}≡${o.el} (triple)`:`${m.center}=${o.el} (double)`).join(', ')}.`,topic:'lewis',pic:2});
    }else steps[steps.length-1].pic=2;

  steps.push({k:'axe',type:'choice',label:'VSEPR notation',prompt:`Look only at ${m.center}. Count its bonded atoms (X) and lone pairs (E).`,opts:shuffle([m.axe,...axeDistract(m.axe)].map(axeHtml)),ans:axeHtml(m.axe),show:`${m.X} bonded atom${m.X>1?'s':''} and ${m.cLP} lone pair${m.cLP===1?'':'s'} on ${m.center}.`,topic:'vsepr'});
  const sh=SHAPES[m.axe];
  steps.push({k:'shape',type:'choice',label:'Molecular shape',prompt:`What shape is ${axeHtml(m.axe)}?`,opts:shuffle(shapeOpts(sh.name)),ans:sh.name,show:`${sh.g} electron groups${sh.lp.length?`, ${sh.lp.length} of them lone pairs`:''}. Bond angle ${sh.angle}.`,topic:'vsepr'});

  let i=0,tries=0,pic=0,wrongs=[];const lines=[];
  const single={...m,outers:m.outers.map(o=>({...o,bo:1}))};
  function render(){
    const done=i>=steps.length;
    const picHtml=pic===0?'':pic===1?lewisSVG(single,{lp:false}):pic===2?lewisSVG(m,{lp:false}):lewisSVG(m);
    let cur='';
    if(!done){
      const st=steps[i];
      cur=`<div class="card flat stack" style="gap:10px"><span class="stepn">Step ${i+1} of ${steps.length}</span><div class="h3" style="font-weight:700">${st.prompt}</div>`+
        (st.type==='num'?`<div class="numrow"><input type="text" inputmode="numeric" autocomplete="off" aria-label="${st.label}" placeholder="Number"><button class="btn primary bchk">Check</button></div><div class="err" hidden>Type a number first.</div>`
        :`<div class="opts">${st.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${'ABCD'[j]}</span><span>${o}</span></button>`).join('')}</div>`)+
        `<div class="bfb"></div><div class="bai">${aiBtn('Nudge me','bnudge')}</div></div>`;
    }else{
      cur=`<div class="card flat stack" style="gap:12px"><div class="row" style="justify-content:space-between"><span class="h2">${m.html} done</span><span class="streak">Built</span></div>
        <div class="summary3"><div><span class="eyebrow">Notation</span><b>${axeHtml(m.axe)}</b></div><div><span class="eyebrow">Shape</span><b>${sh.name}</b></div><div><span class="eyebrow">Angle</span><b>${sh.angle}</b></div></div>
        <canvas class="mol3d" aria-label="3D model of ${m.id}. Drag to rotate."></canvas>

    }
    el.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><span class="h2">Build ${m.html}</span>${m.charge?'<span class="eyebrow">Ion</span>':''}</div>
      ${lines.length?`<div class="nb">${lines.map(l=>`<div class="ln"><div class="lt"><span class="ck">✓</span><b>${l.label}</b><span class="v">${l.value}</span></div><div class="small muted lnote">${l.note}</div></div>`).join('')}</div>`:''}
      ${picHtml?`<div>${picHtml}</div>`:''}${cur}</div>`;
    if(done){mount3D($('canvas',el),molSpec(m));const a=$('.bagain',el),n=$('.bnext',el);if(a)a.addEventListener('click',()=>{i=0;tries=0;pic=0;lines.length=0;render()});if(n)n.addEventListener('click',()=>onNext&&onNext());return}
    const st=steps[i],fb=$('.bfb',el);
    const nb=$('.bnudge',el);
    if(nb)nb.addEventListener('click',()=>{nb.remove();mountThread($('.bai',el),{mode:'nudge',context:`${molFacts(m)} Current step: ${st.label}. ${stripH(st.prompt)} The answer to this step is ${stripH(String(st.ans))}. Never say it. Student's wrong tries so far: ${wrongs.length?wrongs.join(', '):'none'}.`,ask:{text:`Give me a nudge for this step: ${st.label}.`}})});
    const advance=(firstTry)=>{
      record(st.topic,firstTry);
      lines.push({label:st.label,value:st.ans,note:st.show});
      if(st.pic)pic=st.pic;else if(st.k==='center'&&pic<1)pic=1;
      i++;tries=0;wrongs=[];
      if(i>=steps.length){S.built[m.id]=true;save();onDone&&onDone(m)}
      render();
      const target=$('.card',el);if(target&&!lesson)target.scrollIntoView({behavior:REDUCE?'auto':'smooth',block:'nearest'});
    };
    const wrong=()=>{
      tries++;
      fb.innerHTML=`<div class="fb bad"><b class="v">Not quite.</b>${st.hint?st.hint+' ':''}${tries>=2?'<br><button class="btn sm bshow" style="margin-top:8px">Show me</button>':'Try again.'}</div>`;
      const s=$('.bshow',fb);if(s)s.addEventListener('click',()=>advance(false));
    };
    if(st.type==='num'){
      const inp=$('input',el),err=$('.err',el);
      const go=()=>{const v=parseNum(inp.value);if(Number.isNaN(v)){err.hidden=false;return}err.hidden=true;if(v===st.ans)advance(tries===0);else{wrongs.push(v);inp.value='';wrong()}};
      $('.bchk',el).addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});inp.addEventListener('input',()=>err.hidden=true);
    }else{
      $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{const o=st.opts[+b.dataset.j];if(o===st.ans)advance(tries===0);else{wrongs.push(stripH(o));b.classList.add('wrong');b.disabled=true;wrong()}}));
    }
  }
  render();
}
/* ================= graph Lewis renderer (any molecule) ================= */
const GS=62;
function graphLayout(g,st){
  const pts=g.atoms.map(a=>[a.x*GS,a.y*GS]);
  const lpAng=g.atoms.map((a,i)=>{
    const used=[];
    g.bonds.forEach(b=>{if(b.a===i||b.b===i){const j=b.a===i?b.b:b.a;used.push((Math.atan2(-(pts[j][1]-pts[i][1]),pts[j][0]-pts[i][0])*180/Math.PI+360)%360)}});
    return freeAngles(used,st.lp[i]);
  });
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const bx=[Math.min(...xs)-26,Math.max(...xs)+26],by=[Math.min(...ys)-26,Math.max(...ys)+26];
  return {pts,lpAng,bx,by};
}
function answerState(g){return {orders:g.bonds.map(b=>b.o),lp:g.atoms.map(a=>a.lp),bracket:!!g.charge}}
function gLewisSVG(g,st,{edit=false,sel=-1,counts=false,bad=new Set(),maxW=320,label}={}){
  st=st||answerState(g);
  const {pts,lpAng,bx,by}=graphLayout(g,st),f=n=>n.toFixed(1),R=Math.PI/180;
  const dr=s=>s.length>1?16:13;
  let s='';
  g.bonds.forEach((b,k)=>{
    const [x1,y1]=pts[b.a],[x2,y2]=pts[b.b],L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L;
    const sa=dr(g.atoms[b.a].el)+1,sb=dr(g.atoms[b.b].el)+1,o=st.orders[k];
    const ax=x1+ux*sa,ay=y1+uy*sa,bx2=x2-ux*sb,by2=y2-uy*sb,nx=-uy,ny=ux;
    const offs=o===1?[0]:o===2?[-3.4,3.4]:[-5.2,0,5.2];
    offs.forEach(d=>{s+=`<line class="lw-bond" x1="${f(ax+nx*d)}" y1="${f(ay+ny*d)}" x2="${f(bx2+nx*d)}" y2="${f(by2+ny*d)}"/>`});
    if(edit)s+=`<line class="hitb" data-b="${k}" x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx2)}" y2="${f(by2)}"/>`;
  });
  g.atoms.forEach((a,i)=>{
    const [x,y]=pts[i],r=dr(a.el)+3;
    lpAng[i].forEach(an=>{const px=x+r*Math.cos(an*R),py=y-r*Math.sin(an*R),nx=Math.sin(an*R)*3.7,ny=Math.cos(an*R)*3.7;s+=`<circle class="dot" cx="${f(px+nx)}" cy="${f(py+ny)}" r="2.6"/><circle class="dot" cx="${f(px-nx)}" cy="${f(py-ny)}" r="2.6"/>`});
    if(edit&&i===sel)s+=`<circle class="selr" cx="${f(x)}" cy="${f(y)}" r="21"/>`;
    if(bad.has(i))s+=`<circle class="badr" cx="${f(x)}" cy="${f(y)}" r="21"/>`;
    s+=`<text x="${f(x)}" y="${f(y)}" text-anchor="middle" dominant-baseline="central" font-size="20">${a.el}</text>`;
    if(edit)s+=`<circle class="hita" data-a="${i}" cx="${f(x)}" cy="${f(y)}" r="19"/>`;
  });
  if(counts){
    const e=atomElectrons(g,st);

function atomElectrons(g,st){
  const e=g.atoms.map((a,i)=>2*st.lp[i]);

const elName=s=>EL[s]?EL[s].name:s;

  const e=atomElectrons(g,st),errs=[],bad=new Set();let expanded=false;
  const total=g.bonds.reduce((s,b,k)=>s+2*st.orders[k],0)+st.lp.reduce((s,x)=>s+2*x,0);
  if(total!==g.ve)errs.push(`You’ve drawn ${total} electrons, but ${g.html} has ${g.ve} valence electrons.`);
  g.atoms.forEach((a,i)=>{
    const el=a.el,P=EL[el].p,E=e[i];let m=null;
    if(el==='H'){if(bo[i]!==1)m='H can only make one single bond.';else if(st.lp[i])m='H never gets lone pairs. It’s full with 2 electrons.'}
    else if(el==='Be'){if(E!==4)m=`Be stays at 4 electrons (it has ${E}).`}
    else if(el==='B'||el==='Al'){if(E!==6)m=`${el} stays at 6 electrons (it has ${E}). Don’t give it a double bond or a lone pair.`}
    else if(E<8)m=`${el} only has ${E} electrons. It needs 8.`;
    else if(E>8){
      const max=el==='P'?10:12;
      if(P<=2)m=`${el} has ${E} electrons, but period 2 atoms can’t go over 8.`;
      else if(nb[i]<2)m=`This ${el} has ${E} electrons. An outer atom stops at 8.`;
      else if(E>max)m=`${el} has ${E} electrons, which is more than it can hold (${max}).`;
      else expanded=true;
    }
    if(m){errs.push(m);bad.add(i)}
  });
  if(g.charge&&!st.bracket)errs.push(`${g.html} is an ion, so draw it in square brackets with the charge outside.`);
  if(!g.charge&&st.bracket)errs.push(`${g.html} is a neutral molecule, so it doesn’t need brackets.`);
  let note='';
  const m=g.mol;
  if(!errs.length&&expanded&&(!m||m.kase!=='expanded'))note='This expanded version also follows the rules, but there’s an octet version too. Ms. James’s rule is not to exceed an atom’s valence unless you have to.';
  return {ok:!errs.length,errs:uniq(errs),bad,note,total};
}

/* ================= ionic compounds ================= */
function ionPiece(sym,q,dots,brackets){
  const w=brackets?(dots?64:44):(dots?50:34);let s='';const cx=w/2,cy=40;
  s+=`<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="20">${sym}</text>`;
  const r=sym.length>1?16:13;
  const sides=[0,0,0,0];for(let i=0;i<dots;i++)sides[i%4]++;
  sides.forEach((nn,k)=>{const off=nn===2?[-4,4]:nn===1?[0]:[];off.forEach(o=>{const [x,y]=k===0?[cx+o,cy-r-3]:k===1?[cx+r+4,cy+o]:k===2?[cx+o,cy+r+3]:[cx-r-4,cy+o];s+=`<circle class="dot" cx="${x}" cy="${y}" r="2.6"/>`})});
  if(brackets)s+=`<path class="br" d="M7 14H2V66H7"/><path class="br" d="M${w-7} 14H${w-2}V66H${w-7}"/>`;
  if(q)s+=`<text x="${w+1}" y="20" font-size="14">${chargeStr(q)}</text>`;
  return {s,w:w+(q?(Math.abs(q)>1?18:11):4)};
}
function ionicSVG(c,variant='ok'){
  const M={sym:c.m,q:c.mq},N={sym:c.n,q:c.nq};
  let mn=c.mn,nn=c.nn;
  if(variant==='count'){mn=1;nn=1}
  let order=[];
  if(mn===1){const half=Math.floor(nn/2);order=[...Array(half).fill(N),M,...Array(nn-half).fill(N)]}
  else{for(let i=0;i<Math.max(mn,nn);i++){if(i<mn)order.push(M);if(i<nn)order.push(N)}}
  let x=0,s='';
  order.forEach(ion=>{
    const isM=ion===M;let dots,q,br;
    if(variant==='atoms'){dots=EL[ion.sym].val;q=0;br=false}
    else if(variant==='metaldots'){dots=isM?EL[ion.sym].val:8;q=ion.q;br=true}
    else if(variant==='nocharge'){dots=isM?0:8;q=0;br=true}
    else{dots=isM?0:8;q=ion.q;br=true}
    const p=ionPiece(ion.sym,q,dots,br);s+=`<g transform="translate(${x} 0)">${p.s}</g>`;x+=p.w+4;
  });

}

    else body=`<div class="card flat stack" style="gap:12px"><div class="row" style="justify-content:space-between"><span class="h2">${c.html} done</span><span class="streak">Built</span></div>${ionicSVG(c)}${lesson?'':`<div class="grid2"><button class="btn iagain">Build again</button><button class="btn primary inext">Next compound</button></div>`}</div>`;
    el.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><span class="h2">Build ${c.html}</span><span class="eyebrow">Ionic</span></div>${log.length?`<div class="nb">${log.map(l=>`<div class="ln"><div class="lt"><span class="ck">✓</span><b>${l[0]}</b><span class="v">${l[1]}</span></div><div class="small muted lnote">${l[2]}</div></div>`).join('')}</div>`:''}${body}</div>`;

      if(k<shells)s+=`<circle cx="${(130+r).toFixed(1)}" cy="120" r="3" fill="var(--ink-3)"/><circle cx="${(130-r).toFixed(1)}" cy="120" r="3" fill="var(--ink-3)"/>`}
    for(let v=0;v<e.val;v++){const a=-Math.PI/2+v*2*Math.PI/e.val;s+=`<circle cx="${(130+R*Math.cos(a)).toFixed(1)}" cy="${(120+R*Math.sin(a)).toFixed(1)}" r="4.5" fill="var(--accent)"/>`}

    $('.scap',el).innerHTML=mode==='group'?`${e.name}: ${shells} shell${shells>1?'s':''}. Each step down adds a shell of core electrons that shields the valence electron, so the atom grows.`:`${e.name}: still ${shells} shells and the same 2 core electrons, but ${e.z} protons pulling. More pull, same shielding, so the atom shrinks.`;

function wDipole(el){

  el.innerHTML=`<div class="chips">${ids.map(i=>`<button class="chip" data-i="${i}">${MOLS[i].html}</button>`).join('')}</div><svg viewBox="0 0 260 220" style="width:100%;max-width:320px;display:block;margin:0 auto" role="img" aria-label="Bond dipoles and net dipole"><defs><marker id="dpa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--u3)"/></marker><marker id="dpn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs><g class="dv"></g></svg><label class="row small muted" style="gap:8px">Rotate<input type="range" min="0" max="628" value="157" id="dp-rot" style="flex:1"></label><div class="fb info dw"></div>`;

    const rot=([x,y,z])=>{const c=Math.cos(yaw),s=Math.sin(yaw),x1=x*c+z*s,z1=-x*s+z*c,cp=Math.cos(pitch),sp=Math.sin(pitch);return [x1,y*cp-z1*sp,y*sp+z1*cp]};
    const P=p=>{const r=rot(p),f=1/(1-r[2]*.15);return [130+r[0]*72*f,110-r[1]*72*f,r[2]]};
    const net=[0,0,0];let s='';
    const items=pos.map((p,i)=>{const o=m.outers[i],d=ENV[o.el]-ENV[m.center];net[0]+=p[0]*d;net[1]+=p[1]*d;net[2]+=p[2]*d;return {p,o,d,P:P(p)}}).sort((a,b)=>a.P[2]-b.P[2]);
    items.forEach(it=>{s+=`<line x1="130" y1="110" x2="${it.P[0].toFixed(1)}" y2="${it.P[1].toFixed(1)}" stroke="var(--bond)" stroke-width="6" stroke-linecap="round"/>`});
    items.forEach(it=>{
      if(Math.abs(it.d)>=0.4){const dx=it.P[0]-130,dy=it.P[1]-110,L=Math.hypot(dx,dy)||1,nx=-dy/L*11,ny=dx/L*11,k=it.d>0;
        const a0=[130+dx*.25+nx,110+dy*.25+ny],a1=[130+dx*.8+nx,110+dy*.8+ny];const [p0,p1]=k?[a0,a1]:[a1,a0];
        s+=`<line x1="${p0[0].toFixed(1)}" y1="${p0[1].toFixed(1)}" x2="${p1[0].toFixed(1)}" y2="${p1[1].toFixed(1)}" stroke="var(--u3)" stroke-width="2.2" marker-end="url(#dpa)"/>`}
      s+=`<circle cx="${it.P[0].toFixed(1)}" cy="${it.P[1].toFixed(1)}" r="${it.o.el==='H'?11:14}" fill="${CPK[it.o.el]||'#888'}"/><text x="${it.P[0].toFixed(1)}" y="${(it.P[1]+1).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="${hexLum(CPK[it.o.el]||'#888')>.6?'#151726':'#fff'}">${it.o.el}</text>`;

  };

const COMB={Li:1,Na:1,K:1,Rb:1,Mg:2,Ca:2,Sr:2,Ba:2,Al:3,Ga:3,B:3,Si:4,N:3,P:3,O:2,S:2,Se:2,F:1,Cl:1,Br:1,I:1};
const gcd=(a,b)=>b?gcd(b,a%b):a;
function gFormulaPair(){

    const wrong=uniq([sub(`${a}${f(nb)}${b}${f(na)}`),`${a}${b}`,sub(`${a}${b}${ca}`),sub(`${a}2${b}3`)]).filter(x=>x!==right);
    const type=d>1.7?'ionic':d>=0.4?'polar covalent':'mostly covalent';
    return mk('bond',`${a} and ${b} combine. Using their valences, what is the formula?`,[right,...shuffle(wrong).slice(0,3)],`${a} combines with ${ca} and ${b} with ${cb}, so it takes ${na} ${a} for every ${nb} ${b}: ${right}. ΔEN = ${fmt1(d)}, so the bond is ${type}.`);
  }
}
function gGraphVE(){const g=pick(GMOL_LIST);return {t:'num',topic:'lewis',q:`How many valence electrons are in ${g.html} (${g.name})?`,a:g.ve,ex:Object.entries(g.counts).map(([e,n])=>`${e} ${EL[e].val}${n>1?' × '+n:''}`).join(' + ')+` = ${g.ve}.`}}
function gDiatomic(){
  const g=pick(['N2','O2','CO','F2','Cl2','HCl','I2'].map(i=>GMOLS[i])),o=g.bonds[0].o,nm={1:'A single bond',2:'A double bond',3:'A triple bond'};
  return mk('lewis',`In the Lewis structure of ${g.html}, what joins the two atoms?`,[nm[o],...Object.values(nm).filter(x=>x!==nm[o])],`${g.html} has ${g.ve} valence electrons. ${o===3?'Only a triple bond gives both atoms an octet.':o===2?'A double bond plus 2 lone pairs on each atom gives both an octet.':'One shared pair plus lone pairs completes every octet.'}`);

function perturb(g){
  const st=answerState(g),opts=[];
  g.atoms.forEach((a,i)=>{if(a.el!=='H'&&st.lp[i]>0)opts.push(['lp-',i])});
  g.bonds.forEach((b,k)=>{if(st.orders[k]>1)opts.push(['bond-',k]);else if(g.atoms[b.a].el!=='H'&&g.atoms[b.b].el!=='H')opts.push(['bond+',k])});
  g.atoms.forEach((a,i)=>{if(a.el!=='H')opts.push(['lp+',i])});
  if(g.charge)opts.push(['nobr']);
  for(const [k,i] of shuffle(opts)){
    const s={orders:st.orders.slice(),lp:st.lp.slice(),bracket:st.bracket};
    if(k==='lp-')s.lp[i]--;if(k==='lp+')s.lp[i]++;if(k==='bond-')s.orders[i]--;if(k==='bond+')s.orders[i]++;if(k==='nobr')s.bracket=false;
    if(validateLewis(g,s).ok)continue;
    const isC=!g.multi&&i===0;
    const desc={'lp-':isC?'The central atom is missing a lone pair':'An outer atom is missing a lone pair','lp+':isC?'The central atom has an extra lone pair':'An outer atom has an extra lone pair','bond-':'A double or triple bond was drawn too small','bond+':'There’s an extra double bond','nobr':'It needs brackets and a charge'}[k];
    return {st:s,desc};
  }

}
function lewisPool(){return [...MOL_LIST.filter(m=>m.kase!=='expanded'),...GMOL_LIST.filter(g=>g.atoms.length<=6)]}
function gLewisError(){
  for(let t=0;t<40;t++){
    const g=molGraph(pick(lewisPool())),p=perturb(g);if(!p)continue;
    const clean=Math.random()<.2,all=['The central atom is missing a lone pair','An outer atom is missing a lone pair','There’s an extra double bond','A double or triple bond was drawn too small','The central atom has an extra lone pair','Nothing is wrong'];
    const ans=clean?'Nothing is wrong':p.desc;
    return {t:'mcq',topic:'lewis',q:`What, if anything, is wrong with this Lewis structure of ${g.html}?<div style="margin-top:8px">${gLewisSVG(g,clean?null:p.st,{maxW:240})}</div>`,o:[ans,...shuffle(all.filter(x=>x!==ans)).slice(0,3)],ex:clean?`It’s correct: ${g.ve} electrons, and every atom has a full shell.`:`${validateLewis(g,p.st).errs[0]}`};
  }
}
function gLewisPick(){
  for(let t=0;t<40;t++){
    const g=molGraph(pick(lewisPool())),wr=[],seen=new Set();
    for(let k=0;k<12&&wr.length<3;k++){const p=perturb(g);if(!p)break;const key=JSON.stringify(p.st);if(seen.has(key))continue;seen.add(key);wr.push(p.st)}
    if(wr.length<2)continue;
    return mk('lewis',`Which is the correct Lewis structure of ${g.html}?`,[gLewisSVG(g,null,{maxW:180}),...wr.map(s=>gLewisSVG(g,s,{maxW:180}))],`The correct one uses all ${g.ve} electrons and gives every atom a full shell (H 2, most atoms 8).`);
  }
}
function gChartCell(){
  const g=2+rnd(5),es=Object.keys(CHART[g]).map(Number),e=pick(es),n=chartName(g,e);
  const o=uniq([n,...shuffle(Object.values(CHART).flatMap(r=>Object.values(r)))]).slice(0,4);
  return mk('vsepr',`Using the VSEPR chart: ${g} electron groups around the central atom, ${e} of them lone pairs. What’s the shape?`,o,`Row ${g}, column ${e}: ${n}.`);
}
function gChartMol(){
  const m=pick(MOL_LIST.filter(m=>m.X>=2)),g=m.X+m.cLP,n=chartName(g,m.cLP);
  const o=uniq([n,...shuffle(uniq(Object.values(CHART).flatMap(r=>Object.values(r))))]).slice(0,4);
  return mk('vsepr',`Use the chart: what shape is this molecule?<div style="margin-top:8px">${lewisSVG(m)}</div>`,o,`${m.center} has ${m.X} bonded atom${m.X>1?'s':''} and ${m.cLP} lone pair${m.cLP===1?'':'s'}: row ${g}, column ${m.cLP}, ${n}.`);
}
const polPool=()=>[...MOL_LIST.filter(m=>m.pol&&m.pol.polar!==null),...GMOL_LIST.filter(g=>g.pol.polar!==null)];
function polWhy(s){return s.pol.why||(s.pol.polar?`${s.html} has polar bonds arranged so the dipoles don’t cancel.`:`${s.html}’s bonds are nonpolar, or arranged symmetrically so they cancel.`)}
function gMolPolar(){const s=pick(polPool());return mk('polar',`Is ${s.html} a polar or nonpolar molecule?${!s.multi&&Math.random()<.5?`<div style="margin-top:8px">${lewisSVG(s)}</div>`:''}`,s.pol.polar?['Polar','Nonpolar']:['Nonpolar','Polar'],polWhy(s))}
function gBondDipole(){
  const p=bondPair('p'),hi=ENV[p.a]>=ENV[p.b]?p.a:p.b,lo=hi===p.a?p.b:p.a;
  return mk('polar',`In a ${p.a}–${p.b} bond, which way does the bond dipole arrow point?`,[`Toward ${hi}`,`Toward ${lo}`,'It has no direction'],`${hi} is more electronegative (${enS(hi)} vs ${enS(lo)}), so it becomes δ− and the arrow points to it.`);

function gIMFStrongest(){

  return mk('imf',`What is the strongest intermolecular force between ${s.html} molecules?`,[a,...['Hydrogen bonds','Dipole-dipole','London forces','Covalent bonds'].filter(x=>x!==a)],`${i.hb?'It has H bonded to N, O, or F, so it hydrogen bonds.':i.polar?`${s.html} is polar, but has no H on N, O, or F, so dipole-dipole is its strongest.`:`${s.html} is nonpolar, so London forces are all it has.`} Covalent bonds are inside molecules, not between them.`);
}
function gHBcan(){

/* ================= review queue: missed questions come back ================= */
function addReview(q){
  if(!q||!(q.t==='mcq'||q.t==='num')||!q.topic)return;
  const c={t:q.t,topic:q.topic,q:q.q,o:q.o,a:q.a,tol:q.tol,ex:q.ex};
  S.review=(S.review||[]).filter(r=>r.q!==c.q);S.review.push(c);S.review=S.review.slice(-40);save();
}
function dropReview(q){S.review=(S.review||[]).filter(r=>r.q!==q.q);save()}
function reviewFor(topics){const r=(S.review||[]).filter(x=>topics.includes(x.topic));return r.length?Object.assign({},pick(r),{_review:true}):null}

VIEWS.practice.drill=(el,arg)=>{
  arg=arg||'all';
  let topics,level=0,title,book=0;
  const m=arg.match(/^b(\d)-(\d)$/);
  if(m){book=+m[1];level=+m[2];topics=bookTopics(book);title=`${UNITS[book-1].short} · Level ${level}: ${LEVELS[level]}`}
  else if(arg==='boss'){topics=Object.keys(TOPICS);level=3;title='Whole-unit challenge'}
  else if(arg==='review'){topics=Object.keys(TOPICS);title='Review your misses'}
  else if(TOPICS[arg]){topics=[arg];title=TOPICS[arg].name}
  else{topics=Object.keys(TOPICS);title='Everything mixed'}
  const need=6;let streak=0,c=0,n=0,hist=[];
  const L=book?ladder(book):null;
  el.innerHTML=`<div class="stack lg">${backBtn('practice','Practice')}
    <div class="stack" style="gap:10px"><h1 class="h1" style="font-size:clamp(21px,6vw,26px)">${title}</h1>
      ${book?`<div class="stack" style="gap:6px"><div class="bar"><i class="lvb" style="width:0%"></i></div><span class="small muted lvt"></span></div>`:''}</div>
    <div class="row" style="justify-content:space-between"><span class="streak ds">Streak 0</span><span class="eyebrow dacc">0 answered</span></div>
    <div class="card dq"></div><div class="dnext"></div></div>${footer()}`;
  const lvText=()=>{if(!book)return;const goal=Math.min(1,streak/need),last=hist.slice(-10).filter(Boolean).length;$('.lvb',el).style.width=Math.max(goal,last/8)*100+'%';
    $('.lvt',el).textContent=L.passed[level]?'Level passed. Keep going, or move up.':`Get ${need} in a row, or 8 of your last 10, to pass this level.`};
  lvText();
  const next=()=>{
    $('.dnext',el).innerHTML='';
    let q=null;
    if(arg==='review'){q=reviewFor(topics);if(!q){$('.dq',el).innerHTML=`<div class="stack" style="text-align:center;gap:8px"><span class="h2">All cleared</span><p class="muted">You’ve fixed every question you missed. Nice.</p><button class="btn primary" data-go="practice">Back to practice</button></div>`;return}}
    else if(Math.random()<.22)q=reviewFor(topics);
    if(!q)q=genQ(pick(topics),level);
    mountQ($('.dq',el),q,{onAnswer:ok=>{
      record(q.topic,ok);n++;hist.push(ok);if(ok){c++;streak++}else streak=0;
      $('.ds',el).textContent=`Streak ${streak}`;$('.dacc',el).textContent=`${c} / ${n} right`;
      let msg='';
      if(book&&!L.passed[level]&&(streak>=need||hist.slice(-10).filter(Boolean).length>=8)){L.passed[level]=true;if(level<3)L.unlocked=Math.max(L.unlocked,level+1);save();msg=level<3?`<div class="fb good"><b class="v">Level ${level} passed.</b>Level ${level+1}: ${LEVELS[level+1]} is unlocked.</div>`:`<div class="fb good"><b class="v">${UNITS[book-1].short} mastered.</b>Try the whole-unit challenge next.</div>`}
      lvText();
      $('.dnext',el).innerHTML=`${msg}<div class="${msg?'grid2':''}">${msg&&level<3?`<button class="btn" data-go="practice/drill/b${book}-${level+1}">Go to level ${level+1}</button>`:''}<button class="btn primary block dnx">Next question</button></div>`;
      $('.dnx',el).addEventListener('click',()=>{next();$('.dq',el).scrollIntoView({behavior:REDUCE?'auto':'smooth',block:'nearest'})});
    }});
  };
  next();
};
