VIEWS.play.game=(el,k)=>{
  const G=GAMES[k]||GAMES.rush;
  let score=0,streak=0,best=0,right=0,total=0,left=G.time,lock=false,r=null,entry='',misses=[];const t0=Date.now();let bonus=0;
  el.innerHTML=`<div class="stack">${backBtn('play','Games')}
    <div class="row" style="justify-content:space-between"><span class="h2">${G.name}</span><span class="streak gm">×1</span></div>
    <div class="hud"><div><span class="eyebrow">Score</span><b class="gs">0</b></div><div><span class="eyebrow">Streak</span><b class="gk">0</b></div><div><span class="eyebrow">Time</span><b class="gt">${G.time}</b></div></div>
    <div class="timebar"><i style="width:100%"></i></div>
    <div class="prompt gp"></div><div class="ga"></div></div>${footer()}`;
  const mult=()=>1+Math.min(3,Math.floor(streak/3));
  const hud=()=>{$('.gs',el).textContent=score;$('.gk',el).textContent=streak;$('.gm',el).textContent='×'+mult()};
  const next=()=>{
    r=G.round(r&&r.key);entry='';lock=false;
    const p=$('.gp',el);p.className='prompt gp';p.innerHTML=r.prompt;
    const a=$('.ga',el);
    if(r.pad){
      a.innerHTML=`<div class="stack" style="gap:10px"><div class="prompt" style="padding:10px"><div class="entry">&nbsp;</div></div><div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="del" aria-label="Delete">⌫</button><button data-n="0">0</button><button class="go" data-n="ok">Enter</button></div></div>`;
      $$('.keypad button',a).forEach(b=>b.addEventListener('click',()=>{if(lock)return;const n=b.dataset.n;if(n==='del')entry=entry.slice(0,-1);else if(n==='ok'){if(entry)answer(entry);return}else if(entry.length<3)entry+=n;$('.entry',a).innerHTML=entry||'&nbsp;'}));
    }else{
      a.innerHTML=`<div class="opts">${r.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${'ABCD'[j]}</span><span>${o}</span></button>`).join('')}</div>`;
      $$('.opt',a).forEach(b=>b.addEventListener('click',()=>{if(lock)return;b.classList.add(r.opts[+b.dataset.j]===r.ans?'right':'wrong');answer(r.opts[+b.dataset.j])}));
    }
  };
  const answer=v=>{
    lock=true;total++;const ok=v===r.ans;const p=$('.gp',el);
    if(ok){right++;streak++;best=Math.max(best,streak);score+=10*mult();p.classList.add('flash-good');hud();timers.push(setTimeout(next,REDUCE?150:320))}
    else{streak=0;bonus-=G.penalty;misses.push(r);p.classList.add('flash-bad');p.insertAdjacentHTML('beforeend',`<div class="small"><b>Answer: ${r.ans}</b><br>${r.why}</div>`);hud();timers.push(setTimeout(next,1400))}
  };
  const tick=()=>{
    left=Math.max(0,G.time-(Date.now()-t0)/1000+bonus);
    $('.gt',el).textContent=Math.ceil(left);$('.timebar i',el).style.width=(left/G.time*100)+'%';
    if(left<=0)over();
  };
  const over=()=>{
    clearTimers();
    const newBest=score>(S.best[k]||0);if(newBest){S.best[k]=score;save()}
    el.innerHTML=`<div class="stack lg">${backBtn('play','Games')}
      <div class="card stack" style="text-align:center;gap:8px"><span class="eyebrow">${G.name} · time’s up</span><div class="stat">${score}</div>${newBest?'<span class="streak" style="align-self:center">New best</span>':`<p class="small muted">Best: ${S.best[k]}</p>`}
        <div class="summary3" style="margin-top:6px"><div><span class="eyebrow">Right</span><b>${right}/${total}</b></div><div><span class="eyebrow">Best streak</span><b>${best}</b></div><div><span class="eyebrow">Accuracy</span><b>${pct(right,total)}%</b></div></div></div>
      ${misses.length?`<div class="card flat stack" style="gap:8px"><span class="h3">Review your misses</span>${misses.slice(-8).map(m=>`<div class="fb info"><b>${m.ans}</b><br><span class="small">${m.why}</span></div>`).join('')}</div>`:''}
      <div class="grid2"><button class="btn" data-go="play">All games</button><button class="btn primary" data-go="play/game/${k}">Play again</button></div></div>${footer()}`;
  };
  timers.push(setInterval(tick,100));
  next();hud();
};

/* ================= TEST ================= */
const TEST_PLAN=[['elec',5],['trend',4],['bond',3],['lewis',7],['vsepr',6]];
const TEST_MIN=30;
let TS=null;
VIEWS.test.home=el=>{
  el.innerHTML=`<div class="stack lg">
    <div class="stack" style="gap:8px;padding-top:6px"><span class="eyebrow">Mock test</span><h1 class="h1">Unit 1 practice test</h1><p class="muted">25 questions across the whole unit, with a new set every time. No feedback until you hand it in, just like the real thing.</p></div>
    <div class="card stack" style="gap:10px">
      <div class="summary3"><div><span class="eyebrow">Questions</span><b>25</b></div><div><span class="eyebrow">Time</span><b>${TEST_MIN} min</b></div><div><span class="eyebrow">Calculator</span><b>Yes</b></div></div>
      <ul class="small muted" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>Electrons 5 · Trends 4 · Bond types 3 · Lewis 7 · VSEPR 6</li><li>Jump between questions and flag any you want to come back to.</li><li>Have your periodic table out. Electronegativity values are given when you need them.</li></ul>
      ${TS&&!TS.results&&TS.end>Date.now()?'<button class="btn primary block" data-go="test/run">Resume your test</button><button class="btn block" id="t-go">Start a new test</button>':'<button class="btn primary block" id="t-go">Start the test</button>'}
    </div>
    ${S.tests.length?`<div class="card flat stack" style="gap:8px"><span class="h3">Past attempts</span>${S.tests.slice().reverse().map(t=>`<div class="row" style="justify-content:space-between"><span class="small muted">${new Date(t.d).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${new Date(t.d).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</span><b style="font-family:var(--f-mono)">${t.s}/${t.n} · ${pct(t.s,t.n)}%</b></div>`).join('')}</div>`:''}
  </div>${footer()}`;
  $('#t-go',el).addEventListener('click',()=>{TS={qs:genSet(TEST_PLAN),ans:[],flags:[],i:0,end:Date.now()+TEST_MIN*60000};TS.ans=TS.qs.map(()=>({}));go('test','run')});
};
const answeredT=a=>a.sel!=null||(a.val!=null&&String(a.val).trim()!=='');
VIEWS.test.run=el=>{
  if(!TS){go('test');return}
  const draw=()=>{
    const q=TS.qs[TS.i];
    el.innerHTML=`<div class="stack">
      <div class="row" style="justify-content:space-between"><span class="h2">Question ${TS.i+1}<span class="muted" style="font-size:15px"> / ${TS.qs.length}</span></span><span class="clock">--:--</span></div>
      <div class="tnav">${TS.qs.map((_,j)=>`<button data-j="${j}" class="${answeredT(TS.ans[j])?'ans':''}${j===TS.i?' cur':''}${TS.flags[j]?' flag':''}" aria-label="Question ${j+1}">${j+1}</button>`).join('')}</div>
      <div class="card tq"><span class="eyebrow" style="display:block;margin-bottom:8px">${TOPICS[q.topic].name}</span><div></div></div>
      <div class="row" style="justify-content:space-between"><button class="btn sm" id="t-flag">${TS.flags[TS.i]?'Unflag':'Flag for later'}</button><span class="small muted">${TS.ans.filter(answeredT).length} answered</span></div>
      <div class="grid2"><button class="btn" id="t-prev">Previous</button>${TS.i<TS.qs.length-1?'<button class="btn primary" id="t-next">Next</button>':'<button class="btn primary" id="t-fin">Hand it in</button>'}</div>
      ${TS.i<TS.qs.length-1?'<button class="btn ghost block" id="t-fin2">Hand it in early</button>':''}
      <div class="tconf"></div></div>`;
    mountQ($('.tq > div',el),q,{mode:'test',saved:TS.ans[TS.i],onAnswer:()=>{const b=$(`.tnav button[data-j="${TS.i}"]`,el);b.classList.toggle('ans',answeredT(TS.ans[TS.i]))}});
    $$('.tnav button',el).forEach(b=>b.addEventListener('click',()=>{TS.i=+b.dataset.j;draw()}));
    $('#t-flag',el).addEventListener('click',()=>{TS.flags[TS.i]=!TS.flags[TS.i];draw()});
    $('#t-prev',el).addEventListener('click',()=>{if(TS.i>0){TS.i--;draw()}});
    const n=$('#t-next',el);if(n)n.addEventListener('click',()=>{TS.i++;draw()});
    [$('#t-fin',el),$('#t-fin2',el)].forEach(b=>b&&b.addEventListener('click',confirmFin));
    tick();
  };
  const confirmFin=()=>{
    const un=TS.ans.filter(a=>!answeredT(a)).length, fl=TS.flags.filter(Boolean).length;
    $('.tconf',el).innerHTML=`<div class="card stack" style="gap:10px;border-color:var(--accent)"><b>Hand in the test?</b><p class="small muted">${un?`${un} question${un>1?'s are':' is'} still blank.`:'Every question has an answer.'}${fl?` ${fl} flagged.`:''}</p><div class="grid2"><button class="btn" id="t-keep">Keep working</button><button class="btn primary" id="t-sub">Hand it in</button></div></div>`;
    $('#t-keep',el).addEventListener('click',()=>{$('.tconf',el).innerHTML=''});
    $('#t-sub',el).addEventListener('click',submit);
    $('.tconf',el).scrollIntoView({behavior:REDUCE?'auto':'smooth',block:'nearest'});
  };
  const tick=()=>{
    const ms=Math.max(0,TS.end-Date.now()),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);
    const c=$('.clock',el);if(c){c.textContent=`${m}:${String(s).padStart(2,'0')}`;c.classList.toggle('low',ms<5*60000)}
    if(ms<=0)submit();
  };
  const submit=()=>{
    clearTimers();
    const results=TS.qs.map((q,j)=>{const a=TS.ans[j];const ok=q.t==='num'?(answeredT(a)&&Math.abs(parseNum(a.val)-q.a)<=(q.tol||0)+1e-9):a.sel===q.o[0];return {q,a,ok}});
    results.forEach(r=>record(r.q.topic,r.ok));
    const s=results.filter(r=>r.ok).length;
    S.tests.push({d:Date.now(),s,n:results.length});S.tests=S.tests.slice(-8);save();
    TS.results=results;go('test','results');
  };
  timers.push(setInterval(tick,1000));
  draw();
};
VIEWS.test.results=el=>{
  if(!TS||!TS.results){go('test');return}
  const R=TS.results,s=R.filter(r=>r.ok).length;let onlyMiss=true;
  const by={};R.forEach(r=>{by[r.q.topic]=by[r.q.topic]||[0,0];by[r.q.topic][1]++;if(r.ok)by[r.q.topic][0]++});
  const draw=()=>{
    el.innerHTML=`<div class="stack lg">${backBtn('test','Mock test')}
      <div class="card stack" style="text-align:center;gap:8px"><span class="eyebrow">Your score</span><div class="stat">${s}/${R.length}</div><p class="muted">${pct(s,R.length)}% · ${pct(s,R.length)>=86?'Excellent. You’re ready.':pct(s,R.length)>=73?'Good. Clean up the misses below.':pct(s,R.length)>=50?'Getting there. Redo the lessons for your weakest topic.':'Go back through the lessons, then try again.'}</p></div>
      <div class="card flat stack" style="gap:10px"><span class="eyebrow">By topic</span>${Object.entries(by).map(([k,[c,n]])=>`<div class="tbar ${TOPICS[k].u}"><span>${TOPICS[k].name}</span><div class="bar"><i style="width:${pct(c,n)}%"></i></div><span>${c}/${n}</span></div>`).join('')}</div>
      ${TUTOR_CONFIG.url&&R.some(r=>!r.ok)?`<div class="card stack ai-only ai-plan" style="gap:10px"><span class="h3">Study plan from SCODE</span><p class="small muted">SCODE Tutor looks at what you missed and tells you exactly what to redo.</p><div class="ai-row">${aiBtn('Make my study plan','tplan')}</div><div class="tp"></div></div>`:''}
      <div class="row" style="justify-content:space-between"><span class="h2">Review</span><div class="chips"><button class="chip" id="r-miss" aria-pressed="${onlyMiss}">Misses</button><button class="chip" id="r-all" aria-pressed="${!onlyMiss}">All</button></div></div>
      ${R.map((r,j)=>({r,j})).filter(x=>!onlyMiss||!x.r.ok).map(({r,j})=>`<div class="card flat stack" style="gap:8px"><div class="row" style="justify-content:space-between"><span class="eyebrow">Q${j+1} · ${TOPICS[r.q.topic].name}</span><span class="eyebrow" style="color:var(--${r.ok?'good':'bad'})">${r.ok?'Right':'Missed'}</span></div><b>${r.q.q}</b>
        <div class="small">Your answer: <b>${r.q.t==='num'?(answeredT(r.a)?r.a.val:'blank'):(r.a.sel||'blank')}</b></div>
        <div class="fb ${r.ok?'good':'bad'}">Answer: <b>${r.q.t==='num'?r.q.a:r.q.o[0]}</b>. ${r.q.ex}</div></div>`).join('')||'<p class="muted">No misses. Nothing to review.</p>'}
      <div class="grid2"><button class="btn" data-go="practice">Practice zone</button><button class="btn primary" data-go="test">New test</button></div></div>${footer()}`;
    const tp=$('.tplan',el);
    if(tp)tp.addEventListener('click',()=>{tp.parentElement.remove();
      const miss=R.filter(r=>!r.ok).slice(0,6).map((r,j)=>`${j+1}) [${TOPICS[r.q.topic].name}] ${stripH(r.q.q)} Their answer: ${r.q.t==='num'?(answeredT(r.a)?r.a.val:'blank'):(r.a.sel||'blank')}. Correct: ${stripH(qCorrectText(r.q))}.`).join(' ');
      mountThread($('.tp',el),{mode:'plan',context:`Score ${s}/${R.length}. By topic: ${Object.entries(by).map(([k,[c,n]])=>`${TOPICS[k].name} ${c}/${n}`).join(', ')}. Missed questions: ${miss} Lessons on this site: ${LESSONS.map(l=>l.title).join(', ')}. Other tools: Lewis builder, flashcard decks (${DECKS.map(d=>d.name).join(', ')}), endless practice by topic, games.`,ask:{text:'Make me a study plan from my test.'}});
    });
    $('#r-miss',el).addEventListener('click',()=>{onlyMiss=true;draw()});
    $('#r-all',el).addEventListener('click',()=>{onlyMiss=false;draw()});
  };
  draw();
};
